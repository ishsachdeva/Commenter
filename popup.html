<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkedIn Comment Helper</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; padding: 12px; width: 260px; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      p { font-size: 12px; color: #444; margin: 0 0 10px; }
      a, button { font-size: 12px; }
      .row { display: flex; gap: 8px; }
    </style>
  </head>
  <body>
    <h1>LinkedIn Comment Helper</h1>
    <p>Use the inline <strong>AI Comment</strong> button on LinkedIn posts.</p>
    <div class="row">
      <button id="openOptions" type="button">Open Settings</button>
      <a href="https://www.linkedin.com/feed/" target="_blank" rel="noreferrer">Open LinkedIn</a>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
